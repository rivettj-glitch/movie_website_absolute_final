<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Scout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <nav>
        <div class="logo">Movie Scout</div>
        <div class="links">
            <a href="/">Home</a>
            <a href="/movies">Movies</a>
            <a href="/favourites">Favourites</a>
            <a href="/about">About</a>
        </div>
    </nav>

    <div class="movie-controls">
        <a href="/movies" class="view-all">View All Movies</a>

        <form method="GET" action="/movies" class="search-form">
            <input type="text" name="search" placeholder="Search for a movie...">
            <button type="submit">Search</button>
        </form>
    </div>
    
    <form method="GET" action="/movies" class="sort-by">
        <input type="hidden" name="search" value="{{request.args.get('search','')}}">
        <label for="sort">Sort By:</label>
        <select name="sort" id="sort" onchange="this.form.submit()">
            <option value="">Default</option>
            <option value="price_asc" {% if request.args.get('sort') == 'price_asc' %} Selected{% endif %}>Price: Low to High</option>
            <option value="price_desc" {% if request.args.get('sort') == 'price_desc' %} Selected{% endif %}>Price: High to Low</option>
            <option value="name_asc" {% if request.args.get('sort') == 'name_asc' %} Selected{% endif %}>Name: A-Z</option>
            <option value="name_desc" {% if request.args.get('sort') == 'name_desc' %} Selected{% endif %}>Name: Z-A</option>
            <option value="rating_desc" {% if request.args.get('sort') == 'rating_desc' %} Selected{% endif %}>Top Rated</option>
            <option value="rating_asc" {% if request.args.get('sort') == 'rating_asc' %} Selected{% endif %}>Lowest Rated</option>
            <option value="year_desc" {% if request.args.get('sort') == 'year_desc' %} Selected{% endif %}>Newest</option>
            <option value="year_asc" {% if request.args.get('sort') == 'year_asc' %} Selected{% endif %}>Oldest</option>
            <option value="length_asc" {% if request.args.get('sort') == 'length_asc' %} Selected{% endif %}>Length: Short to Long</option>
            <option value="length_desc" {% if request.args.get('sort') == 'length_desc' %} Selected{% endif %}>Length: Long to Short</option>
            <option value="best_sellers" {% if request.args.get('sort') == 'best_sellers' %} Selected{% endif %}>Best Selling</option>
        </select>
    </form>

    

    <h2>Movies</h2>
    {% if movies %}
        <div class="movie-grid">
        {% for movie in movies %}
            <div class="movie">
                <div class="movie-poster">
                    <img src="{{ url_for('poster', movie_id=movie[0]) }}" alt="{{ movie[1] }}">
                </div>
                <h2>{{ movie[1] }}</h2>
                <p>{{ movie[2] }} | {{ movie[3] }} mins | {{ movie[4] }}</p>
                <h3>${{ movie[5] }}</h3>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <p>No movies found. Try searching for another movie!</p>
    {% endif %}
</body>
</html>
