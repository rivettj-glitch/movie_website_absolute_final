<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Scout</title>
</head>
<body>
    <h1>Movies</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Release Year</th>
            <th>Length</th>
            <th>Age Rating</th>
            <th>Cost</th>
            <th>Bestseller</th>
        </tr>
        {% for movie in movies %}
        <tr>
            <td>{{ movie[0] }}</td>
            <td>{{ movie[1] }}</td>
            <td>{{ movie[2] }}</td>
            <td>{{ movie[3] }}</td>
            <td>{{ movie[4] }}</td>
            <td>{{ movie[5] }}</td>
            <td>{{ movie[6] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
